<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم BRITTON</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><header class="topbar"><a class="brand" href="index.html">BRITTON <small>ADMIN PANEL</small></a><button id="logout" class="round hidden">تسجيل الخروج</button></header><main class="admin-wrap"><section id="loginBox" class="admin-card"><h1>دخول الإدارة</h1><p class="muted">استخدم حساب Appwrite الذي أنشأته للمسؤول.</p><form id="loginForm"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary wide">دخول</button></form><p id="loginMsg" class="hint"></p></section><section id="dashboard" class="hidden"><h1>لوحة التحكم</h1><div class="admin-tabs"><button data-tab="products" class="selected">المنتجات</button><button data-tab="categories">الأقسام</button><button data-tab="orders">الطلبات والفواتير</button></div><section id="productsTab" class="admin-card"><h2>إضافة منتج / تعديل منتج</h2><form id="productForm"><input type="hidden" name="docId"><label>اسم المنتج<input name="name" required></label><label>القسم<input name="category" required></label><label>السعر<input name="price" type="number" min="0" required></label><label>الوصف<textarea name="description" rows="3"></textarea></label><label>رابط صورة المنتج<input name="imageUrl" type="url" placeholder="https://..."></label><button class="primary">حفظ المنتج</button></form><div id="productList"></div></section><section id="categoriesTab" class="admin-card hidden"><h2>إضافة قسم</h2><form id="categoryForm"><label>اسم القسم<input name="name" required></label><label>رابط صورة القسم<input name="imageUrl" type="url"></label><button class="primary">حفظ القسم</button></form><div id="categoryList"></div></section><section id="ordersTab" class="admin-card hidden"><h2>الطلبات والفواتير</h2><div id="orderList"></div></section></section></main><script type="module" src="admin.js"></script></body></html>
